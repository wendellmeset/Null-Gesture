[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "null-gesture"
version = "2.0.0"
description = "Multi-modal gesture detection without a camera — IMU + RFID + UWB neural network fusion."
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pyserial>=3.5",
    "PyQt6>=6.5",
    "pyqtgraph>=0.13",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["null_gesture*"]

[project.scripts]
null-gesture = "null_gesture.__main__:main"
